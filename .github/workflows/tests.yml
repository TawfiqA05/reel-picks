# The offline fast checks (npm test; see Tests in the README). They need no
# key, token or secret: every outside service is a local stand-in or a saved
# answer. The browser checks (npm run test:ui) aren't run here: on GitHub's
# runner they took over 17 minutes, and eight of the design suite's font-swap
# checks fail on Linux, which has no Arial for the fallback fonts' metrics.
name: Tests

on:
  push:
  pull_request:
    branches: [main]

env:
  # The dev machine's zone, so every date the tests work out matches it.
  TZ: America/Indianapolis

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The function suite drives the app in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test

